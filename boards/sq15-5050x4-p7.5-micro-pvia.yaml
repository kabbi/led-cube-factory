# 2x2 WS2812B 5050 on a 15mm square at 7.5mm pitch, half the edge, so the
# LED grid stays even across tile edges; the widest that keeps the LED bodies
# 0.3mm from the micro edge connector's pads. (5.5mm, courtyards touching,
# fits a 13mm edge.)
shape: square
edge: 15.0
connector: edge_connector_micro
# twelve of the 1.3mm jumpers don't fit the back
jumper: jumper_small
leds:
  part: ws2812b-5050
  cols: 2
  rows: 2
  pitch: 7.5
# one 0603 cap for four LEDs, in a corner by P2 the hubs leave free
caps: {part: c100n-0603, ports: [2], along: [3.0], inset: 1.9}
# turned over (PASS at the bottom): at 13mm / 5.5mm the default layout left
# P4 boxed in by the OUT hub's link to the last LED
hubs: {angle: 180, radius: 3.0, jumper_radius: 1.6}
router:
  power_vias: pattern
