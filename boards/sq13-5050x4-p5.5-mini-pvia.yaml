# Smallest 5050 tile: 2x2 WS2812B at 5.5mm pitch (courtyards touching) on a
# 13mm square, the LED bodies 0.3mm from the mini edge connector's pads.
# Mates only with other mini-connector tiles.
shape: square
edge: 13.0
connector: edge_connector_mini
# twelve of the 1.3mm jumpers don't fit the back
jumper: jumper_small
leds:
  part: ws2812b-5050
  cols: 2
  rows: 2
  pitch: 5.5
# one 0603 cap for four LEDs, in the free corner by P2 (the hubs take the rest)
caps: {part: c100n-0603, ports: [2], along: [3.0], inset: 1.9}
# turned over (PASS at the bottom): the default layout leaves P4 boxed in by
# the OUT hub's link to the last LED
hubs: {angle: 180, radius: 3.0, jumper_radius: 1.6}
router:
  power_vias: pattern
