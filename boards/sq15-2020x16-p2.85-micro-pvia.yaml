# 4x4 WS2812B-2020 at 2.85mm pitch (courtyards just clear) on a 15mm square,
# with the micro edge connector like the other small tiles. Fits 13.5mm (the
# LED pads 0.25mm from the connector pads); 15mm to match the 2x2 5050.
shape: square
edge: 15.0
connector: edge_connector_micro
jumper: jumper_small
leds:
  part: ws2812b-2020
  cols: 4
  rows: 4
  pitch: 2.85
# one 0603 cap, in a corner by P2 the hubs leave free
caps: {part: c100n-0603, ports: [2], along: [3.2], inset: 1.9}
# through vias only fit the LED column gaps, so the back's In2 crossings are
# scarce: 5 of 128 hub layouts swept at 15mm route clean (1 of 144 at 13.5mm)
hubs: {angle: 180, radius: 4.2, jumper_radius: 1.7}
router:
  power_vias: pattern
# the dense pair's rules (JLC multilayer minimums)
rules: {track_width: 0.127, clearance: 0.1, hole_copper_clearance: 0.2}
